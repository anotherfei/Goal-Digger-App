name: goal_digger_genkit_backend
description: >
  Goal Digger – Firebase Genkit backend written in native Dart.
  Deploys to Cloud Run. Uses Genkit Dart SDK with the Google GenAI plugin
  to run Gemma 4 (cloud) AI flows.
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  # ── Genkit Dart SDK ────────────────────────────────────────────────────────
  genkit: ^0.2.0
  genkit_google_genai: ^0.2.0
  # Uncomment for Vertex AI instead of AI Studio:
  # genkit_google_vertexai: ^0.2.0

  # ── HTTP server ────────────────────────────────────────────────────────────
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_cors_headers: ^0.1.5

  # ── JWT / Auth ─────────────────────────────────────────────────────────────
  # FIX: Added `http` — required by genkit_server.dart to fetch Firebase's
  # JWKS public-key endpoint for RS256 signature verification.
  # Previously `http` was missing, causing a compile error.
  http: ^1.2.2
  jose: ^0.3.5           # RS256 JWT signature verification

  # ── Utilities ──────────────────────────────────────────────────────────────
  dotenv: ^4.2.0
  logging: ^1.2.0
  collection: ^1.18.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
