name: goal_digger_flutter
description: Flutter remake of Goal Digger productivity companion with Firebase + Firebase AI (Genkit) integration.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.0
  firebase_storage: ^12.3.0
  firebase_app_check: ^0.3.1
  google_sign_in: ^6.2.1
  provider: ^6.1.2
  rxdart: ^0.28.0
  http: ^1.2.2
  cloud_functions: ^5.0.4
  connectivity_plus: ^6.0.5
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  uuid: ^4.4.2
  intl: ^0.19.0
  firebase_messaging: ^15.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lumi/
    - assets/auri/
    - assets/porc/
    - assets/mush/
    - assets/cels/
    - assets/pyro/
    - assets/gbat/
    - assets/nong/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 900
